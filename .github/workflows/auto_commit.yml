name: Auto Daily Commit (Green Streak Generator)

on:
  schedule:
    # Runs every day at 12:00 UTC (5:30 PM IST)
    - cron: "0 12 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Daily Activity Ping
        run: |
          git config --local user.email "hyderrr2004@gmail.com"
          git config --local user.name "hyderali345"
          echo "Automated daily streak ping: $(date -u)" > LAST_ACTIVE.txt
          git add LAST_ACTIVE.txt
          git commit -m "⚡ chore: daily streak activity update [$(date -u +'%Y-%m-%d')]" || echo "No changes to commit"

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
